[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xenoteer"
version = "0.1.0"
description = "Async Python SDK for the Xenoteer v1 desktop automation API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Wyatt Griffith and Xenoteer contributors" },
]
keywords = ["automation", "desktop", "x11", "accessibility", "asyncio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "mypy>=1.11,<2",
  "ruff>=0.8,<1",
]

[project.urls]
Repository = "https://github.com/th317erd/xenoteer"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["xenoteer*"]

[tool.setuptools.package-data]
xenoteer = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/xenoteer", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100
