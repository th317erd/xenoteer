<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    The bus daemon runs as desktop UID 1000, which remains implicitly admitted.
    EXTERNAL authentication must also admit the separately privileged daemon
    UID; supplemental filesystem groups alone do not authorize a D-Bus peer.
  -->
  <policy context="default">
    <allow user="1001"/>
  </policy>
</busconfig>
