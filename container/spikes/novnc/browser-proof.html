<!doctype html>

<html lang="en" data-connected="false">
<head>
  <meta charset="utf-8">
  <title>Xenoteer pinned noVNC proof</title>
  <style>
    html, body, #screen { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #202124; }
    #screen { display: flex; }
    #screen > * { margin: auto; }
  </style>
  <script type="module">
    import RFB from './core/rfb.js';

    const screen = document.getElementById('screen');
    let desktopName = '';
    let resolveConnected;
    let resolveNamed;
    const connected = new Promise((resolve) => { resolveConnected = resolve; });
    const named = new Promise((resolve) => { resolveNamed = resolve; });
    const rfb = new RFB(screen, 'ws://127.0.0.1:6080/websockify');

    // Client policy is defense in depth. The RFB server independently rejects
    // all key, pointer, resize, and clipboard input in the executable probe.
    rfb.viewOnly = true;
    rfb.scaleViewport = true;
    rfb.shared = true;
    rfb.addEventListener('desktopname', (event) => {
      desktopName = event.detail.name;
      resolveNamed();
    });
    rfb.addEventListener('connect', () => resolveConnected());
    rfb.addEventListener('disconnect', (event) => {
      if (!event.detail.clean) {
        throw new Error('noVNC disconnected before proof completed');
      }
    });

    // Top-level await keeps the page load pending, so headless Chromium's DOM
    // and screenshot commands cannot capture a merely "connecting" UI.
    await Promise.all([connected, named]);
    const canvas = screen.querySelector('canvas');
    if (!(canvas instanceof HTMLCanvasElement)) {
      throw new Error('noVNC did not create its framebuffer canvas');
    }
    document.documentElement.dataset.connected = 'true';
    document.documentElement.dataset.desktopName = desktopName;
    document.documentElement.dataset.framebuffer = `${canvas.width}x${canvas.height}`;
  </script>
</head>
<body>
  <div id="screen"></div>
</body>
</html>
