[package]
name = "xenoteer-x11-fixtures"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BUSL-1.1"
description = "Standalone X11 recorder and deterministic color-bar fixtures"
publish = false

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
x11rb = { version = "=0.14.0", default-features = false, features = ["extra-traits", "xtest"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace]
