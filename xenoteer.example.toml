# Xenoteer Phase-0 configuration example.
# Defaults are documented and validated in crates/xenoteer-core/src/config.rs.

[server]
listen = "127.0.0.1:8080"
request_body_limit_bytes = 1048576
insecure_disable_auth = false

[auth]
token_file = "/run/xenoteer/api-token"
grants = [
  "desktop:status",
  "desktop:observe",
  "input:control",
  "application:launch",
  "application:terminate",
]

[desktop]
display_width = 1920
display_height = 1080
depth = 24
dpi = 96

[input]
queue_capacity = 256
pointer_nominal_speed_px_s = 1200
pointer_move_min_ms = 80
pointer_move_max_ms = 650
pointer_sample_rate_hz = 60
pre_click_dwell_ms = 30
pointer_press_ms = 50
keyboard_hold_ms = 35

[limits]
default_action_timeout_ms = 30000
accepted_commands_per_principal = 32
accepted_commands_per_daemon = 128
result_ledger_entries = 10000
result_ledger_ttl_seconds = 900

[artifacts]
root_directory = "/run/xenoteer/artifacts"
max_object_bytes = 33554432
max_total_bytes = 1073741824
max_objects = 1024
max_owner_bytes = 268435456
max_owner_objects = 256
max_retention_ms = 3600000
clipboard_input_retention_ms = 900000
upload_total_timeout_ms = 60000
upload_idle_timeout_ms = 10000

[observation]
request_capacity = 128
max_waiters = 128
token_capacity = 8192
cursor_ttl_ms = 60000
reference_ttl_ms = 900000
raw_request_timeout_ms = 2000
startup_timeout_ms = 10000
idle_poll_interval_ms = 5
max_live_windows = 4096
max_tombstones = 8192
tombstone_ttl_ms = 900000

[accessibility]
enabled = true
request_capacity = 128
event_capacity = 4096
max_waiters = 128
token_capacity = 65536
cursor_ttl_ms = 30000
max_cached_nodes = 100000
max_tombstones = 100000
max_nodes_per_query = 25000
max_selector_depth = 64
max_query_matches = 1000
max_snapshot_nodes = 10000
max_snapshot_bytes = 16777216
proxy_timeout_ms = 2000
query_timeout_ms = 10000
reconnect_initial_backoff_ms = 100
reconnect_max_backoff_ms = 5000

[viewer]
enabled = false
allowed_origins = []
backend_address = "127.0.0.1:6080"
no_vnc_root = "/usr/share/novnc"
ticket_capacity = 1024
ticket_ttl_seconds = 60
connect_timeout_ms = 3000
write_timeout_ms = 5000
idle_timeout_ms = 120000
session_timeout_ms = 28800000
maximum_frame_bytes = 8388608
maximum_sessions = 16
view_only = true

[logging]
filter = "info,xenoteer=debug"
