[package]
name = "xenoteer-atspi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "BUSL-1.1"
description = "AT-SPI platform adapter and executable backend probes for Xenoteer"
publish = false

[features]
default = []
live-atspi = ["dep:atspi-connection", "dep:atspi-proxies", "dep:tokio", "dep:zbus"]

[dependencies]
atspi-connection = { workspace = true, optional = true }
atspi-proxies = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"], optional = true }
zbus = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
