[package]
name = "xenoteerd"
description = "Xenoteer desktop-control daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "BUSL-1.1"
publish = false

[dependencies]
