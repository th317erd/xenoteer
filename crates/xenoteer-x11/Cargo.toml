[package]
name = "xenoteer-x11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "BUSL-1.1"
description = "X11 platform adapter and executable backend probes for Xenoteer"
publish = false

[features]
default = []
native-xkbcommon = ["dep:xkbcommon", "x11rb/allow-unsafe-code"]

[dependencies]
fast_image_resize = { version = "=6.0.0", default-features = false, features = ["only_u8x4", "std"] }
mio = { version = "=1.2.2", features = ["os-ext", "os-poll"] }
png = { version = "=0.18.1", default-features = false }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
xenoteer-core = { version = "=0.1.0", path = "../xenoteer-core" }
xenoteer-protocol = { version = "=0.1.0", path = "../xenoteer-protocol" }
x11rb = { version = "=0.14.0", default-features = false, features = [
  "composite",
  "damage",
  "extra-traits",
  "image",
  "randr",
  "shm",
  "xfixes",
  "xkb",
  "xtest",
] }
xkbcommon = { version = "=0.9.0", default-features = false, features = ["x11"], optional = true }

[dev-dependencies]
proptest.workspace = true
serde = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true
