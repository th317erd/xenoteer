[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["AEOR Development"]
repository = "https://github.com/th317erd/xenoteer"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "=4.6.3", features = ["derive", "env"] }
http = "=1.4.2"
schemars = { version = "=1.2.1", features = ["uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
time = { version = "=0.3.54", features = ["formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "=1.1.3"
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.0", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "=1.24.0", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "debuginfo"
