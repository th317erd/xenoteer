[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["AEOR Development"]
repository = "https://github.com/th317erd/xenoteer"

[workspace.dependencies]
atspi-connection = { version = "=0.14.0", default-features = false, features = ["wrappers"] }
atspi-proxies = { version = "=0.14.0", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
clap = { version = "=4.6.3", features = ["derive", "env"] }
futures-util = "=0.3.32"
getrandom = "=0.4.3"
hmac = { version = "=0.13.0", default-features = false }
http = "=1.4.2"
http-body-util = "=0.1.4"
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
libc = "=0.2.187"
nix = { version = "=0.29.0", default-features = false, features = ["process", "signal", "user"] }
ordered-stream = "=0.2.0"
proptest = "=1.11.0"
regex-automata = { version = "=0.4.16", default-features = false, features = ["std", "syntax", "nfa-thompson", "unicode"] }
schemars = { version = "=1.2.1", features = ["uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
thiserror = "=2.0.19"
time = { version = "=0.3.54", features = ["formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = { version = "=0.7.18", default-features = false, features = ["io", "rt"] }
toml = "=1.1.3"
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.0", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
tungstenite = { version = "=0.29.0", default-features = false }
uuid = { version = "=1.24.0", features = ["serde", "v4", "v7"] }
zbus = { version = "=5.18.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "debuginfo"
