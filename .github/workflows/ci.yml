name: Rust quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Refresh native package metadata
        run: sudo apt-get update
      - name: Install native build headers
        run: sudo apt-get install --yes libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev
      - run: cargo fmt --all --check
      - name: Check standalone X11 fixture formatting
        run: cargo fmt --manifest-path fixtures/x11/Cargo.toml --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Lint standalone X11 fixtures
        run: cargo clippy --manifest-path fixtures/x11/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked --exclude xenoteer-sdk --exclude xenoteerctl
      - name: Test standalone X11 fixtures
        run: cargo test --manifest-path fixtures/x11/Cargo.toml --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo run --locked -p xenoteer-protocol --bin generate-schemas -- --check

  sdk-rust:
    name: Frozen v1 Rust SDK, CLI, and package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sdk-rust
      - name: Validate the frozen language-neutral corpus
        timeout-minutes: 1
        run: timeout 10s python3 scripts/conformance/validate.py
      - name: Exercise the Rust SDK adapter
        timeout-minutes: 10
        run: timeout 8m cargo test --locked --jobs 2 -p xenoteer-sdk --all-targets -- --test-threads=2
      - name: Exercise the Rust CLI process boundary
        timeout-minutes: 10
        run: timeout 8m cargo test --locked --jobs 2 -p xenoteerctl --all-targets -- --test-threads=2
      - name: Inspect deterministic Rust package archives
        timeout-minutes: 10
        run: timeout 8m python3 scripts/packages/verify-boundaries.py

  sdk-typescript:
    name: TypeScript SDK on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install exact TypeScript development dependencies
        working-directory: packages/typescript
        timeout-minutes: 5
        run: timeout 4m npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise the TypeScript SDK
        working-directory: packages/typescript
        timeout-minutes: 10
        run: timeout 3m npm test
      - name: Exercise TypeScript shared conformance
        working-directory: packages/typescript
        timeout-minutes: 10
        run: timeout 3m npm run conformance
      - name: Inspect the TypeScript package boundary
        working-directory: packages/typescript
        timeout-minutes: 10
        run: timeout 3m npm run verify-pack

  sdk-python:
    name: Python SDK on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact Python development dependencies
        timeout-minutes: 5
        run: timeout 4m python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps --requirement packages/python/requirements-test.lock
      - name: Install the Python SDK without dependency resolution
        timeout-minutes: 5
        run: timeout 1m python3 -m pip install --disable-pip-version-check --no-build-isolation --no-deps --editable packages/python
      - name: Exercise the Python SDK
        timeout-minutes: 10
        run: timeout 3m python3 -m unittest discover -s packages/python/tests -v
      - name: Exercise Python shared conformance
        timeout-minutes: 10
        run: timeout 2m python3 scripts/conformance/run.py --adapter python3 packages/python/scripts/run_conformance.py
      - name: Type-check the Python SDK
        timeout-minutes: 10
        run: timeout 2m python3 -m mypy --cache-dir "$RUNNER_TEMP/xenoteer-mypy-cache" packages/python/src packages/python/scripts
      - name: Lint the Python SDK
        timeout-minutes: 10
        run: timeout 2m python3 -m ruff check --no-cache packages/python/src packages/python/tests packages/python/scripts
      - name: Build the exact Python wheel and source distribution
        timeout-minutes: 5
        run: timeout 3m python3 -m build --no-isolation --outdir "$RUNNER_TEMP/xenoteer-python-dist" packages/python
      - name: Inspect the exact Python wheel and source distribution
        timeout-minutes: 5
        run: timeout 1m python3 packages/python/scripts/verify_dist.py "$RUNNER_TEMP/xenoteer-python-dist/xenoteer-0.1.0-py3-none-any.whl" "$RUNNER_TEMP/xenoteer-python-dist/xenoteer-0.1.0.tar.gz"

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
      - name: Check standalone X11 fixture dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: fixtures/x11/Cargo.toml
          command: check
          arguments: --all-features --locked

  native-platform:
    name: Native X11 and AT-SPI spikes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: native-platform
      - name: Install native platform and static-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            dbus-x11 \
            gir1.2-gtk-3.0 \
            jq \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-xkb-dev \
            python3-gi \
            ripgrep \
            shellcheck \
            x11-utils \
            xauth \
            xvfb
      - name: Container and provenance static gates
        run: scripts/container/test-static.sh
      - name: Lint Dockerfile with pinned Hadolint
        run: |
          source container/locks/release.lock
          sudo docker run --rm -i "$HADOLINT_IMAGE" \
            hadolint --failure-threshold warning - < Dockerfile
      - name: Authenticated X11, XTEST, capture, and xkbcommon spikes
        run: tests/platform/run-x11-spikes.sh
      - name: Real GTK and AT-SPI spike
        run: tests/platform/run-atspi-spike.sh
      - name: Concurrent isolated-display regression
        run: tests/platform/run-concurrent-spikes.sh

  container-phase2:
    name: Pinned Phase 2 container and application matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install static-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq ripgrep shellcheck
      - name: Verify immutable inputs online
        run: scripts/container/validate-locks.sh --online
      - name: Build pinned Phase 2 runtime image
        env:
          XENOTEER_IMAGE: xenoteer:phase2
        run: scripts/container/build.sh
      - name: Exercise PID 1, health, shutdown, failure, and hardened profiles
        timeout-minutes: 30
        run: sudo scripts/container/test-image.sh xenoteer:phase2
      - name: Exercise slow-subscriber resync under real X11 event churn
        timeout-minutes: 10
        run: sudo scripts/container/test-phase4-event-flood.sh xenoteer:phase2
      - name: Exercise real loopback view-only noVNC chain
        run: sudo env XENOTEER_NOVNC_SPIKE_BASE_IMAGE=xenoteer:phase2 scripts/container/test-novnc-spike.sh
      - name: Build exact derived desktop application fixture
        env:
          XENOTEER_IMAGE: xenoteer:phase2
          XENOTEER_DESKTOP_APPS_IMAGE: xenoteer:desktop-apps-test
        run: scripts/container/build-desktop-app-fixture.sh
      - name: Exercise GTK, Qt, browser, Electron, accessibility, and hardened matrix
        run: sudo scripts/container/test-desktop-app-image.sh xenoteer:desktop-apps-test
      - name: Exercise Phase 4 clipboard, window-control, and capture API matrix
        timeout-minutes: 20
        run: sudo scripts/container/test-phase4-live-fixtures.py xenoteer:desktop-apps-test
      - name: Exercise Phase 5 bounded AT-SPI and semantic-control matrix
        timeout-minutes: 25
        run: sudo nice -n 15 ionice -c 3 scripts/container/test-phase5-atspi-live.py xenoteer:desktop-apps-test

  container-phase2-soak:
    name: Phase 2 30-minute idle soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq ripgrep shellcheck
      - name: Verify immutable inputs online
        run: scripts/container/validate-locks.sh --online
      - name: Build pinned Phase 2 runtime image
        env:
          XENOTEER_IMAGE: xenoteer:phase2-soak
        run: scripts/container/build.sh
      - name: Hold exact idle runtime healthy for 30 minutes
        run: sudo env XENOTEER_IDLE_SOAK_SECONDS=1800 scripts/container/test-idle-soak.sh xenoteer:phase2-soak
