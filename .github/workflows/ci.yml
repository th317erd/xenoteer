name: Rust quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install native build headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev
      - run: cargo fmt --all --check
      - name: Check standalone X11 fixture formatting
        run: cargo fmt --manifest-path fixtures/x11/Cargo.toml --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Lint standalone X11 fixtures
        run: cargo clippy --manifest-path fixtures/x11/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - name: Test standalone X11 fixtures
        run: cargo test --manifest-path fixtures/x11/Cargo.toml --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo run --locked -p xenoteer-protocol --bin generate-schemas -- --check

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
      - name: Check standalone X11 fixture dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: fixtures/x11/Cargo.toml
          command: check
          arguments: --all-features --locked

  native-platform:
    name: Native X11 and AT-SPI spikes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: native-platform
      - name: Install native platform and static-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            dbus-x11 \
            gir1.2-gtk-3.0 \
            jq \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-xkb-dev \
            python3-gi \
            ripgrep \
            shellcheck \
            x11-utils \
            xauth \
            xvfb
      - name: Container and provenance static gates
        run: scripts/container/test-static.sh
      - name: Lint Dockerfile with pinned Hadolint
        run: |
          source container/locks/release.lock
          sudo docker run --rm -i "$HADOLINT_IMAGE" \
            hadolint --failure-threshold warning - < Dockerfile
      - name: Authenticated X11, XTEST, capture, and xkbcommon spikes
        run: tests/platform/run-x11-spikes.sh
      - name: Real GTK and AT-SPI spike
        run: tests/platform/run-atspi-spike.sh
      - name: Concurrent isolated-display regression
        run: tests/platform/run-concurrent-spikes.sh

  container-phase2:
    name: Pinned Phase 2 container and application matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install static-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq ripgrep shellcheck
      - name: Verify immutable inputs online
        run: scripts/container/validate-locks.sh --online
      - name: Build pinned Phase 2 runtime image
        env:
          XENOTEER_IMAGE: xenoteer:phase2
        run: scripts/container/build.sh
      - name: Exercise PID 1, health, shutdown, failure, and hardened profiles
        timeout-minutes: 30
        run: sudo scripts/container/test-image.sh xenoteer:phase2
      - name: Exercise slow-subscriber resync under real X11 event churn
        timeout-minutes: 10
        run: sudo scripts/container/test-phase4-event-flood.sh xenoteer:phase2
      - name: Exercise real loopback view-only noVNC chain
        run: sudo env XENOTEER_NOVNC_SPIKE_BASE_IMAGE=xenoteer:phase2 scripts/container/test-novnc-spike.sh
      - name: Build exact derived desktop application fixture
        env:
          XENOTEER_IMAGE: xenoteer:phase2
          XENOTEER_DESKTOP_APPS_IMAGE: xenoteer:desktop-apps-test
        run: scripts/container/build-desktop-app-fixture.sh
      - name: Exercise GTK, Qt, browser, Electron, accessibility, and hardened matrix
        run: sudo scripts/container/test-desktop-app-image.sh xenoteer:desktop-apps-test
      - name: Exercise Phase 4 clipboard, window-control, and capture API matrix
        timeout-minutes: 20
        run: sudo scripts/container/test-phase4-live-fixtures.py xenoteer:desktop-apps-test

  container-phase2-soak:
    name: Phase 2 30-minute idle soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq ripgrep shellcheck
      - name: Verify immutable inputs online
        run: scripts/container/validate-locks.sh --online
      - name: Build pinned Phase 2 runtime image
        env:
          XENOTEER_IMAGE: xenoteer:phase2-soak
        run: scripts/container/build.sh
      - name: Hold exact idle runtime healthy for 30 minutes
        run: sudo env XENOTEER_IDLE_SOAK_SECONDS=1800 scripts/container/test-idle-soak.sh xenoteer:phase2-soak
